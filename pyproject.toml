[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyuca"
version = "2.0.0"
description = "a Python implementation of the Unicode Collation Algorithm"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-allkeys"]
authors = [{ name = "James Tauber", email = "jtauber@jtauber.com" }]
keywords = ["unicode", "collation", "uca", "sorting", "i18n", "text"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jtauber/pyuca"
Repository = "https://github.com/jtauber/pyuca"
Issues = "https://github.com/jtauber/pyuca/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyright>=1.1.390",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["pyuca"]
# Ship the gzipped DUCET tables and the PEP 561 marker alongside the code.
artifacts = ["pyuca/*.txt.gz", "pyuca/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["pyuca", "scripts", "tests", "CollationTest", "README.md", "LICENSE", "LICENSE-allkeys"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pyright]
include = ["pyuca", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["pyuca"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = ["if TYPE_CHECKING:"]
